- name: Create VLAN's and add interfaces to interfaces
  hosts: ciscoIOS
  gather_facts: false
  vars:
    target_vlan_dir: "{{ (vlan_dir | default(playbook_dir ~ '/../../Input/VLAN')) | realpath }}"
    target_vlan_file: "{{ (vlan_file | default(target_vlan_dir ~ '/VLANs.yaml')) | realpath }}"
    target_iface_file: "{{ (interface_file | default(target_vlan_dir ~ '/VLAN_interfaces.yaml')) | realpath }}"

  pre_tasks:
    - name: Pre-Flight Validation - Execute network validation engine
      ansible.builtin.command:
        argv:
          - python3
          - "{{ (playbook_dir ~ '/../../Validation/orchestrator.py') | realpath }}"
          - "--dry-run"
          - "-v"
          - "{{ target_vlan_file }}"
          - "-i"
          - "{{ target_iface_file }}"
      delegate_to: localhost
      run_once: true
      register: validation_output
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Pre-Flight Validation - Display validation report
      ansible.builtin.debug:
        msg: "{{ validation_output.stdout_lines }}"
      run_once: true
      check_mode: false

    - name: Pre-Flight Validation - Halt on blocking issues
      ansible.builtin.fail:
        msg: "Pre-flight validation detected blocking issues (ERROR / CONFLICT). Playbook aborted. Review the report above."
      when: validation_output.rc != 0
      run_once: true
      check_mode: false

  tasks:
    - name: Include the VLAN variables
      ansible.builtin.include_vars:
        dir: "{{ target_vlan_dir }}"
    - name: Create VLAN's
      cisco.ios.ios_vlans:
        config:
          - name: "{{ item.name }}"
            vlan_id: "{{ item.id }}"
        state: merged
      loop: "{{ VLANS[inventory_hostname] | default([]) }}"
    - name: Add interface to the VLAN that are in access mode
      cisco.ios.ios_l2_interfaces:
        config:
          - name: "{{ item.name }}"
            mode: "{{ item.mode }}"
            access:
              vlan: "{{ item.access_vlan }}"
        state: merged
      loop: "{{ interfaces[inventory_hostname] | default([]) | expand_interfaces }}"
      when: item.mode == "access"
    - name: Add interface to the VLAN that are in trunk mode
      cisco.ios.ios_l2_interfaces:
        config:
          - name: "{{ item.name }}"
            mode: "{{ item.mode }}"
            trunk:
              native_vlan: "{{ item.native_vlan | default(omit) }}"
              allowed_vlans: "{{ item.allowed_vlans | default(omit) }}"
        state: merged
      loop: "{{ interfaces[inventory_hostname] | default([]) | expand_interfaces }}"
      when: item.mode == "trunk"
    - name: Add interface description
      cisco.ios.ios_interfaces:
        config:
          - name: "{{ item.name }}"
            description: "{{ item.description }}"
            enabled: "{{ item.enable | default(true) }}"
        state: merged
      loop: "{{ interfaces[inventory_hostname] | default([]) | expand_interfaces }}"
    - name: Display the VLAN info
      ansible.utils.cli_parse:
        command: show vlan brief
        parser:
          name: ansible.netcommon.ntc_templates
        set_fact: VLAN_details
    - name: Display the VLAN brief info
      ansible.builtin.debug:
        var: VLAN_details
