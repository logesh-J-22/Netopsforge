# User requested to give native VLAN to 999 to the interfaces that are in trunk mode.


interfaces: 
    SW1:
    - name: Et0/0
      description: "Connected to PC1"
      mode: access
      access_vlan: 10
      enable: true
    - name: Et0/1
      description: "Connected to PC2"
      mode: access
      access_vlan: 20
      enable: true
    - name: Et0/2
      description: "Connected to R1"
      mode: trunk
      native_vlan: 999
      allowed_vlans:
        - 10
        - 20
        - 30
      enable: true
 